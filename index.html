<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#064E3B">

  <title>Brocode — Community</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Main CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

  <div class="app-shell">

    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="topbar">

      <a href="index.html" class="brand" aria-label="Brocode Home">

        <span class="brand-mark">B</span>

        <span class="brand-text">
          <strong>Brocode</strong>
          <small>Community</small>
        </span>

      </a>

      <div class="top-actions">

        <!-- Explore -->
        <a
          href="explore.html"
          class="icon-btn"
          aria-label="Explore"
          title="Explore"
        >
          <span aria-hidden="true">⌕</span>
        </a>

        <!-- Notifications -->
        <a
          href="notifications.html"
          class="icon-btn notification-btn"
          aria-label="Notifications"
          title="Notifications"
        >
          <span aria-hidden="true">♢</span>
          <i aria-hidden="true"></i>
        </a>

      </div>

    </header>


    <!-- ==================================================
         MAIN CONTENT
    ================================================== -->

    <main class="content">

      <!-- ================= WELCOME ================= -->

      <section class="welcome-row">

        <div class="welcome-content">

          <span class="eyebrow">
            WELCOME TO BROCODE
          </span>

          <h1 id="feedTitle">
            All Posts
          </h1>

          <p class="subcopy">
            Ideas, tips, knowledge and conversations worth your time.
          </p>

        </div>

        <!-- Create Post -->
        <a
          href="create-post.html"
          class="create-btn"
          aria-label="Create a new post"
        >
          <span aria-hidden="true">＋</span>
          <b>Post</b>
        </a>

      </section>


      <!-- ==================================================
           CATEGORY SLIDER
      ================================================== -->

      <section
        class="category-wrap"
        aria-label="Post categories"
      >

        <button
          class="category-arrow left"
          id="categoryPrev"
          type="button"
          aria-label="Previous category"
        >
          ‹
        </button>

        <div
          id="categorySlider"
          class="category-slider"
          tabindex="0"
          aria-label="Categories"
        ></div>

        <button
          class="category-arrow right"
          id="categoryNext"
          type="button"
          aria-label="Next category"
        >
          ›
        </button>

      </section>


      <!-- ==================================================
           FEED TOOLBAR
      ================================================== -->

      <div class="feed-toolbar">

        <div class="feed-meta">

          <span
            id="postCount"
            class="post-count"
          >
            0 posts
          </span>

          <span
            class="live-dot"
            aria-hidden="true"
          ></span>

          <span class="live-text">
            Live feed
          </span>

        </div>

        <button
          class="sort-btn"
          id="sortBtn"
          type="button"
          aria-label="Change post sorting"
        >
          Latest
          <span aria-hidden="true">⌄</span>
        </button>

      </div>


      <!-- ==================================================
           POST FEED
      ================================================== -->

      <section
        id="feed"
        class="feed"
        aria-live="polite"
      ></section>

    </main>


    <!-- ==================================================
         PREMIUM BOTTOM NAVIGATION
         
         IMPORTANT:
         Do NOT add "active" manually here.
         js/app.js handles the active page automatically.
    ================================================== -->

    <nav
      class="bottom-nav"
      aria-label="Main navigation"
    >

      <div class="bottom-nav-inner">

        <!-- HOME -->
        <a
          href="index.html"
          class="nav-item"
          aria-label="Home"
          data-nav="home"
        >
          <span
            class="nav-icon"
            aria-hidden="true"
          >⌂</span>

          <span class="nav-label">
            Home
          </span>
        </a>


        <!-- EXPLORE -->
        <a
          href="explore.html"
          class="nav-item"
          aria-label="Explore"
          data-nav="explore"
        >
          <span
            class="nav-icon"
            aria-hidden="true"
          >⌕</span>

          <span class="nav-label">
            Explore
          </span>
        </a>


        <!-- CHAT -->
        <a
          href="support.html"
          class="nav-item"
          aria-label="Chat"
          data-nav="chat"
        >
          <span
            class="nav-icon"
            aria-hidden="true"
          >◌</span>

          <span class="nav-label">
            Chat
          </span>
        </a>


        <!-- PROFILE -->
        <a
          href="profile.html"
          class="nav-item"
          aria-label="Profile"
          data-nav="profile"
        >
          <span
            class="nav-icon"
            aria-hidden="true"
          >◯</span>

          <span class="nav-label">
            Profile
          </span>
        </a>

      </div>

    </nav>

  </div>


  <!-- ==================================================
       TOAST
  ================================================== -->

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>


  <!-- ==================================================
       JAVASCRIPT
  ================================================== -->

  <script src="js/app.js"></script>
  <script src="js/posts.js"></script>

</body>
</html>
