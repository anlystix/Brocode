<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d14">

  <title>Brocode — Community</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

  <div class="app-shell">

    <!-- ================= HEADER ================= -->

    <header class="topbar">

      <a href="index.html" class="brand">

        <span class="brand-mark">B</span>

        <span class="brand-text">
          <strong>Brocode</strong>
          <small>Community</small>
        </span>

      </a>

      <div class="top-actions">

        <a
          href="explore.html"
          class="icon-btn"
          aria-label="Explore"
          title="Explore"
        >
          <span>⌕</span>
        </a>

        <a
          href="notifications.html"
          class="icon-btn notification-btn"
          aria-label="Notifications"
          title="Notifications"
        >
          <span>♢</span>
          <i></i>
        </a>

      </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="content">

      <!-- Welcome -->

      <section class="welcome-row">

        <div class="welcome-content">

          <span class="eyebrow">
            WELCOME TO BROCODE
          </span>

          <h1 id="feedTitle">
            All Posts
          </h1>

          <p class="subcopy">
            Ideas, tips, knowledge and conversations worth your time.
          </p>

        </div>


        <a
          href="create-post.html"
          class="create-btn"
        >

          <span>＋</span>

          <b>Post</b>

        </a>

      </section>


      <!-- ================= CATEGORY SLIDER ================= -->

      <section
        class="category-wrap"
        aria-label="Post categories"
      >

        <button
          class="category-arrow left"
          id="categoryPrev"
          type="button"
          aria-label="Previous category"
        >
          ‹
        </button>


        <div
          id="categorySlider"
          class="category-slider"
          tabindex="0"
        >
        </div>


        <button
          class="category-arrow right"
          id="categoryNext"
          type="button"
          aria-label="Next category"
        >
          ›
        </button>

      </section>


      <!-- ================= FEED TOOLBAR ================= -->

      <div class="feed-toolbar">

        <div class="feed-meta">

          <span
            id="postCount"
            class="post-count"
          >
            0 posts
          </span>

          <span class="live-dot"></span>

          <span class="live-text">
            Live feed
          </span>

        </div>


        <button
          class="sort-btn"
          id="sortBtn"
          type="button"
        >
          Latest
          <span>⌄</span>
        </button>

      </div>


      <!-- ================= FEED ================= -->

      <section
        id="feed"
        class="feed"
        aria-live="polite"
      >
      </section>

    </main>


    <!-- ================= BOTTOM NAV ================= -->

    <nav
      class="bottom-nav"
      aria-label="Main navigation"
    >

      <a
        href="index.html"
        class="active"
      >

        <span class="nav-icon">
          ⌂
        </span>

        <span>
          Home
        </span>

      </a>


      <a href="explore.html">

        <span class="nav-icon">
          ⌕
        </span>

        <span>
          Explore
        </span>

      </a>


      <a href="support.html">

        <span class="nav-icon">
          ◌
        </span>

        <span>
          Chat
        </span>

      </a>


      <a href="profile.html">

        <span class="nav-icon">
          ◯
        </span>

        <span>
          Profile
        </span>

      </a>

    </nav>

  </div>


  <!-- ================= TOAST ================= -->

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  >
  </div>


  <!-- ================= JAVASCRIPT ================= -->

  <script src="js/app.js"></script>
  <script src="js/posts.js"></script>

</body>
</html>
