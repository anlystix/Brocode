<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Saved Posts · Brocode</title>

  <meta
    name="description"
    content="Your saved posts on Brocode."
  />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <style>
    /* =========================================
       SAVED PAGE
    ========================================= */

    .saved-page {
      min-height: 100vh;
      padding-bottom: 110px;
    }

    .saved-container {
      width: min(100%, 920px);
      margin: 0 auto;
      padding: 24px 18px 40px;
    }

    /* Header */

    .saved-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 26px;
    }

    .saved-heading {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .saved-back {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(255,255,255,.035);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: .2s ease;
    }

    .saved-back:hover {
      background: rgba(255,255,255,.07);
      transform: translateX(-2px);
    }

    .saved-back svg {
      width: 19px;
      height: 19px;
    }

    .saved-title {
      margin: 0;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .saved-subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .saved-count {
      min-width: 38px;
      height: 30px;
      padding: 0 11px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(139,92,246,.13);
      border: 1px solid rgba(139,92,246,.25);
      color: #c4b5fd;
      font-size: 12px;
      font-weight: 800;
    }

    /* Toolbar */

    .saved-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(17,21,31,.7);
      backdrop-filter: blur(12px);
    }

    .saved-toolbar-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .saved-clear {
      border: 0;
      background: transparent;
      color: #a78bfa;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
    }

    .saved-clear:hover {
      background: rgba(139,92,246,.1);
    }

    /* Empty State */

    .saved-empty {
      min-height: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(139,92,246,.09),
          transparent 38%
        ),
        rgba(17,21,31,.72);
    }

    .saved-empty-icon {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      background: rgba(139,92,246,.1);
      border: 1px solid rgba(139,92,246,.2);
      color: #a78bfa;
    }

    .saved-empty-icon svg {
      width: 31px;
      height: 31px;
    }

    .saved-empty h2 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 800;
    }

    .saved-empty p {
      max-width: 420px;
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .saved-home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 19px;
      border-radius: 12px;
      border: 1px solid rgba(139,92,246,.35);
      background: linear-gradient(
        135deg,
        rgba(139,92,246,.95),
        rgba(124,58,237,.95)
      );
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 10px 28px rgba(124,58,237,.18);
      transition: .2s ease;
    }

    .saved-home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(124,58,237,.25);
    }

    /* Saved Post Card */

    .saved-posts {
      display: grid;
      gap: 14px;
    }

    .saved-post {
      position: relative;
      padding: 19px;
      border: 1px solid var(--border);
      border-radius: 19px;
      background: rgba(17,21,31,.82);
      transition: .22s ease;
    }

    .saved-post:hover {
      border-color: rgba(139,92,246,.3);
      transform: translateY(-1px);
    }

    .saved-post-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .saved-post-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .saved-avatar {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: linear-gradient(
        135deg,
        rgba(139,92,246,.2),
        rgba(99,102,241,.1)
      );
      border: 1px solid rgba(139,92,246,.2);
      color: #c4b5fd;
      font-size: 12px;
      font-weight: 800;
    }

    .saved-author {
      min-width: 0;
    }

    .saved-author-name {
      color: var(--text);
      font-size: 12px;
      font-weight: 750;
    }

    .saved-post-time {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .saved-category {
      display: inline-flex;
      align-items: center;
      min-height: 25px;
      padding: 0 9px;
      border-radius: 999px;
      background: rgba(139,92,246,.09);
      border: 1px solid rgba(139,92,246,.17);
      color: #b9a7ff;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .saved-post-title {
      margin: 15px 0 7px;
      color: var(--text);
      font-size: 16px;
      line-height: 1.4;
      font-weight: 800;
    }

    .saved-post-content {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .saved-post-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 17px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,.055);
    }

    .saved-post-stats {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--muted);
      font-size: 11px;
    }

    .saved-post-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .saved-action {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255,255,255,.025);
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: .2s ease;
    }

    .saved-action:hover {
      color: var(--text);
      background: rgba(255,255,255,.06);
    }

    .saved-action.remove {
      color: #c4b5fd;
    }

    .saved-action svg {
      width: 15px;
      height: 15px;
    }

    /* Mobile */

    @media (max-width: 600px) {
      .saved-container {
        padding: 18px 14px 30px;
      }

      .saved-title {
        font-size: 22px;
      }

      .saved-header {
        margin-bottom: 20px;
      }

      .saved-toolbar {
        padding: 11px 12px;
      }

      .saved-post {
        padding: 16px;
        border-radius: 17px;
      }

      .saved-post-title {
        font-size: 15px;
      }

      .saved-post-content {
        font-size: 12.5px;
      }

      .saved-category {
        display: none;
      }

      .saved-empty {
        min-height: 360px;
      }
    }
  </style>
</head>

<body>

  <div class="saved-page">

    <main class="saved-container">

      <!-- Header -->
      <header class="saved-header">

        <div class="saved-heading">

          <button
            class="saved-back"
            type="button"
            onclick="history.back()"
            aria-label="Go back"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5"/>
              <path d="M12 19l-7-7 7-7"/>
            </svg>
          </button>

          <div>
            <h1 class="saved-title">Saved Posts</h1>
            <p class="saved-subtitle">
              Posts you've saved for later
            </p>
          </div>

        </div>

        <span class="saved-count" id="savedCount">0</span>

      </header>


      <!-- Toolbar -->
      <div class="saved-toolbar" id="savedToolbar">

        <span class="saved-toolbar-label">
          Your personal collection
        </span>

        <button
          class="saved-clear"
          id="clearSavedBtn"
          type="button"
        >
          Clear all
        </button>

      </div>


      <!-- Posts -->
      <section
        class="saved-posts"
        id="savedPosts"
      ></section>


      <!-- Empty State -->
      <section
        class="saved-empty"
        id="savedEmpty"
        hidden
      >

        <div class="saved-empty-icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M6 4.5A2.5 2.5 0 0 1 8.5 2h7A2.5 2.5 0 0 1 18 4.5V21l-6-3-6 3V4.5Z"/>
          </svg>

        </div>

        <h2>No saved posts yet</h2>

        <p>
          When you find something useful, funny, or worth coming back to,
          save it here and access it anytime.
        </p>

        <a
          href="index.html"
          class="saved-home-btn"
        >
          Explore Posts
        </a>

      </section>

    </main>


    <!-- Bottom Navigation -->
    <nav class="bottom-nav" aria-label="Main navigation">

      <a
        href="index.html"
        class="bottom-nav-item"
      >
        <span class="bottom-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3 10.5 12 3l9 7.5"/>
            <path d="M5.5 9.5V21h13V9.5"/>
            <path d="M9.5 21v-6h5v6"/>
          </svg>
        </span>
        <span>Home</span>
      </a>

      <a
        href="explore.html"
        class="bottom-nav-item"
      >
        <span class="bottom-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="11" cy="11" r="6.5"/>
            <path d="m16 16 5 5"/>
          </svg>
        </span>
        <span>Explore</span>
      </a>

      <a
        href="support.html"
        class="bottom-nav-item"
      >
        <span class="bottom-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H8l-4 2v-5.5A7.5 7.5 0 1 1 20 11.5Z"/>
            <path d="M8 11h.01"/>
            <path d="M12 11h.01"/>
            <path d="M16 11h.01"/>
          </svg>
        </span>
        <span>Chat</span>
      </a>

      <a
        href="profile.html"
        class="bottom-nav-item"
      >
        <span class="bottom-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="8" r="3.5"/>
            <path d="M5 21a7 7 0 0 1 14 0"/>
          </svg>
        </span>
        <span>Profile</span>
      </a>

    </nav>

  </div>


  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
  ></div>


  <script src="js/app.js"></script>

  <script>
    /*
     * =========================================
     * BROCODE - SAVED POSTS
     * Demo/localStorage version
     * =========================================
     */

    const savedPostsEl = document.getElementById("savedPosts");
    const savedEmptyEl = document.getElementById("savedEmpty");
    const savedCountEl = document.getElementById("savedCount");
    const savedToolbarEl = document.getElementById("savedToolbar");
    const clearSavedBtn = document.getElementById("clearSavedBtn");

    const STORAGE_KEY = "brocode_demo_v1";

    const fallbackPosts = [
      {
        id: "p1",
        username: "TechMind",
        title: "5 habits that make learning anything easier",
        content: "Small consistent habits can completely change the way you learn and retain information.",
        category: "Tips",
        likes: 124,
        comments: 18,
        time: "2h ago"
      },
      {
        id: "p2",
        username: "DailyDose",
        title: "You don't need motivation every day",
        content: "Build systems that keep you moving even when motivation disappears.",
        category: "Motivation",
        likes: 96,
        comments: 11,
        time: "4h ago"
      },
      {
        id: "p3",
        username: "CodeBro",
        title: "One simple productivity hack",
        content: "Before starting your work, decide the single most important task you must finish today.",
        category: "Hacks",
        likes: 82,
        comments: 9,
        time: "6h ago"
      }
    ];

    function getStoredData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);

        if (!raw) return {};

        return JSON.parse(raw) || {};
      } catch (error) {
        console.warn("Could not read saved posts data.", error);
        return {};
      }
    }

    function getSavedIds() {
      const data = getStoredData();

      if (Array.isArray(data.savedPosts)) {
        return data.savedPosts;
      }

      if (Array.isArray(data.saved)) {
        return data.saved;
      }

      try {
        const legacy = JSON.parse(
          localStorage.getItem("brocode_saved_posts") || "[]"
        );

        return Array.isArray(legacy) ? legacy : [];
      } catch {
        return [];
      }
    }

    function getAllPosts() {
      const data = getStoredData();

      if (Array.isArray(data.posts) && data.posts.length) {
        return data.posts;
      }

      try {
        const legacy = JSON.parse(
          localStorage.getItem("brocode_posts") || "[]"
        );

        if (Array.isArray(legacy) && legacy.length) {
          return legacy;
        }
      } catch {
        // Ignore invalid legacy data.
      }

      return fallbackPosts;
    }

    function initials(name) {
      return String(name || "User")
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map(word => word.charAt(0))
        .join("")
        .toUpperCase();
    }

    function escapeHTML(value) {
      if (window.BrocodeApp && typeof window.BrocodeApp.escapeHTML === "function") {
        return window.BrocodeApp.escapeHTML(value);
      }

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function removeSavedPost(postId) {
      const data = getStoredData();

      let savedIds = getSavedIds();

      savedIds = savedIds.filter(id => String(id) !== String(postId));

      data.savedPosts = savedIds;

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
      );

      try {
        const legacy = JSON.parse(
          localStorage.getItem("brocode_saved_posts") || "[]"
        );

        if (Array.isArray(legacy)) {
          localStorage.setItem(
            "brocode_saved_posts",
            JSON.stringify(
              legacy.filter(id => String(id) !== String(postId))
            )
          );
        }
      } catch {
        // Ignore legacy storage errors.
      }

      renderSavedPosts();

      showSavedToast("Post removed from saved");
    }

    function showSavedToast(message) {
      if (
        window.BrocodeApp &&
        typeof window.BrocodeApp.showToast === "function"
      ) {
        window.BrocodeApp.showToast(message);
        return;
      }

      const toast = document.getElementById("toast");

      if (!toast) return;

      toast.textContent = message;
      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    function createPostCard(post) {
      const id = escapeHTML(post.id);
      const username = escapeHTML(
        post.username || post.author || "Brocode User"
      );
      const title = escapeHTML(post.title || "Untitled Post");
      const content = escapeHTML(post.content || "");
      const category = escapeHTML(post.category || "Community");
      const likes = Number(post.likes || 0);
      const comments = Number(post.comments || 0);
      const time = escapeHTML(post.time || "Recently");

      return `
        <article class="saved-post" data-post-id="${id}">

          <div class="saved-post-top">

            <div class="saved-post-meta">

              <div class="saved-avatar">
                ${escapeHTML(initials(username))}
              </div>

              <div class="saved-author">
                <div class="saved-author-name">
                  @${username}
                </div>

                <div class="saved-post-time">
                  ${time}
                </div>
              </div>

            </div>

            <span class="saved-category">
              ${category}
            </span>

          </div>


          <h2 class="saved-post-title">
            ${title}
          </h2>


          <p class="saved-post-content">
            ${content}
          </p>


          <div class="saved-post-footer">

            <div class="saved-post-stats">
              <span>♥ ${likes}</span>
              <span>💬 ${comments}</span>
            </div>

            <div class="saved-post-actions">

              <button
                class="saved-action remove"
                type="button"
                data-remove-saved="${id}"
                aria-label="Remove from saved"
                title="Remove from saved"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path d="M6 4.5A2.5 2.5 0 0 1 8.5 2h7A2.5 2.5 0 0 1 18 4.5V21l-6-3-6 3V4.5Z"/>
                </svg>
              </button>

            </div>

          </div>

        </article>
      `;
    }

    function renderSavedPosts() {
      const savedIds = getSavedIds();
      const allPosts = getAllPosts();

      const savedPosts = allPosts.filter(post =>
        savedIds.some(
          id => String(id) === String(post.id)
        )
      );

      savedCountEl.textContent = savedPosts.length;

      if (!savedPosts.length) {
        savedPostsEl.innerHTML = "";
        savedPostsEl.hidden = true;
        savedEmptyEl.hidden = false;
        savedToolbarEl.hidden = true;
        return;
      }

      savedToolbarEl.hidden = false;
      savedEmptyEl.hidden = true;
      savedPostsEl.hidden = false;

      savedPostsEl.innerHTML = savedPosts
        .map(createPostCard)
        .join("");
    }

    clearSavedBtn.addEventListener("click", () => {
      const savedIds = getSavedIds();

      if (!savedIds.length) {
        showSavedToast("No saved posts to clear");
        return;
      }

      const confirmed = confirm(
        "Are you sure you want to remove all saved posts?"
      );

      if (!confirmed) return;

      const data = getStoredData();

      data.savedPosts = [];

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
      );

      localStorage.removeItem("brocode_saved_posts");

      renderSavedPosts();

      showSavedToast("All saved posts removed");
    });


    savedPostsEl.addEventListener("click", event => {

      const removeButton = event.target.closest(
        "[data-remove-saved]"
      );

      if (!removeButton) return;

      const postId = removeButton.dataset.removeSaved;

      removeSavedPost(postId);
    });


    window.addEventListener("storage", event => {
      if (
        event.key === STORAGE_KEY ||
        event.key === "brocode_saved_posts" ||
        event.key === "brocode_posts"
      ) {
        renderSavedPosts();
      }
    });


    renderSavedPosts();
  </script>

</body>
</html>
