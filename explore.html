<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0b0d14"
  >

  <title>Explore — Brocode</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <link
    rel="stylesheet"
    href="css/components.css"
  >

  <link
    rel="stylesheet"
    href="css/responsive.css"
  >

  <style>

    /* =====================================================
       EXPLORE PAGE
       ===================================================== */

    .explore-page {
      padding-top: 28px;
    }


    .explore-heading {
      margin-bottom: 24px;
    }


    .explore-heading .eyebrow {
      margin-bottom: 8px;
    }


    .explore-heading h1 {
      margin: 0 0 7px;
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: -0.8px;
    }


    .explore-heading p {
      margin: 0;
      max-width: 520px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }


    /* SEARCH */

    .explore-search {
      position: relative;
      margin-bottom: 30px;
    }


    .explore-search input {
      width: 100%;
      height: 52px;

      padding: 0 50px 0 46px;

      border: 1px solid var(--border);
      border-radius: 17px;

      outline: none;

      background: var(--surface);
      color: var(--text);

      font-family: inherit;
      font-size: 13px;

      transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }


    .explore-search input::placeholder {
      color: var(--muted-2);
    }


    .explore-search input:focus {
      border-color: rgba(139, 92, 246, .55);

      background: var(--surface-2);

      box-shadow:
        0 0 0 4px rgba(139, 92, 246, .08);
    }


    .search-icon {
      position: absolute;

      left: 17px;
      top: 50%;

      transform: translateY(-50%);

      width: 19px;
      height: 19px;

      display: grid;
      place-items: center;

      color: var(--muted);

      font-size: 21px;

      pointer-events: none;
    }


    .clear-search {
      position: absolute;

      right: 12px;
      top: 50%;

      transform: translateY(-50%);

      width: 30px;
      height: 30px;

      display: none;
      place-items: center;

      border: 0;
      border-radius: 10px;

      background: var(--surface-3);
      color: var(--muted);

      cursor: pointer;
    }


    .clear-search.show {
      display: grid;
    }


    /* SECTION */

    .explore-section {
      margin-bottom: 31px;
    }


    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 13px;
    }


    .section-head h2 {
      margin: 0;

      font-size: 14px;
      font-weight: 700;

      color: var(--text);
    }


    .section-head span {
      color: var(--muted-2);
      font-size: 10px;
    }


    /* TRENDING */

    .trending-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }


    .trending-card {
      display: flex;
      align-items: center;
      gap: 13px;

      width: 100%;
      padding: 14px;

      border: 1px solid var(--border);
      border-radius: 16px;

      background: var(--surface);

      cursor: pointer;

      transition:
        transform .2s ease,
        border-color .2s ease,
        background .2s ease;
    }


    .trending-card:hover {
      transform: translateY(-1px);

      border-color: var(--border-hover);

      background: var(--surface-2);
    }


    .trend-number {
      width: 30px;
      min-width: 30px;
      height: 30px;

      display: grid;
      place-items: center;

      border-radius: 10px;

      background: var(--surface-3);

      color: var(--muted);

      font-size: 11px;
      font-weight: 700;
    }


    .trend-info {
      min-width: 0;
      flex: 1;
    }


    .trend-title {
      margin: 0 0 4px;

      overflow: hidden;

      color: var(--text);

      font-size: 12px;
      font-weight: 600;

      white-space: nowrap;
      text-overflow: ellipsis;
    }


    .trend-meta {
      display: flex;
      align-items: center;
      gap: 7px;

      color: var(--muted-2);

      font-size: 9px;
    }


    .trend-arrow {
      color: var(--muted-2);
      font-size: 17px;
    }


    /* CATEGORY DISCOVER */

    .discover-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 10px;
    }


    .discover-card {
      position: relative;

      min-height: 105px;

      padding: 16px;

      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: 17px;

      background:
        linear-gradient(
          145deg,
          var(--surface-2),
          var(--surface)
        );

      cursor: pointer;

      transition:
        transform .2s ease,
        border-color .2s ease;
    }


    .discover-card:hover {
      transform: translateY(-2px);

      border-color: var(--border-hover);
    }


    .discover-icon {
      width: 32px;
      height: 32px;

      display: grid;
      place-items: center;

      margin-bottom: 13px;

      border-radius: 10px;

      background: rgba(139, 92, 246, .10);

      color: var(--primary);

      font-size: 15px;
    }


    .discover-card h3 {
      margin: 0 0 4px;

      font-size: 12px;
      font-weight: 700;

      color: var(--text);
    }


    .discover-card p {
      margin: 0;

      color: var(--muted-2);

      font-size: 9px;
    }


    .discover-glow {
      position: absolute;

      right: -25px;
      bottom: -35px;

      width: 90px;
      height: 90px;

      border-radius: 50%;

      background: rgba(139, 92, 246, .07);

      filter: blur(4px);

      pointer-events: none;
    }


    /* SEARCH RESULTS */

    .search-results {
      display: none;
    }


    .search-results.show {
      display: block;
    }


    .search-result-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }


    .search-result {
      display: flex;
      align-items: center;
      gap: 12px;

      padding: 13px;

      border: 1px solid var(--border);
      border-radius: 15px;

      background: var(--surface);
    }


    .result-avatar {
      width: 36px;
      height: 36px;

      min-width: 36px;

      display: grid;
      place-items: center;

      border-radius: 12px;

      background:
        linear-gradient(
          145deg,
          rgba(139, 92, 246, .22),
          rgba(99, 102, 241, .10)
        );

      color: #c4b5fd;

      font-size: 12px;
      font-weight: 700;
    }


    .result-info {
      min-width: 0;
      flex: 1;
    }


    .result-info strong {
      display: block;

      margin-bottom: 3px;

      color: var(--text);

      font-size: 11px;
    }


    .result-info span {
      display: block;

      color: var(--muted-2);

      font-size: 9px;
    }


    .result-type {
      padding: 6px 8px;

      border-radius: 8px;

      background: var(--surface-3);

      color: var(--muted);

      font-size: 8px;
      font-weight: 600;
    }


    .no-results {
      padding: 30px 15px;

      border: 1px dashed var(--border);

      border-radius: 17px;

      text-align: center;
    }


    .no-results-icon {
      margin-bottom: 10px;

      color: var(--muted-2);

      font-size: 22px;
    }


    .no-results h3 {
      margin: 0 0 5px;

      color: var(--text);

      font-size: 13px;
    }


    .no-results p {
      margin: 0;

      color: var(--muted-2);

      font-size: 10px;
    }


    @media (min-width: 600px) {

      .explore-page {
        padding-top: 36px;
      }

      .explore-heading h1 {
        font-size: 34px;
      }

      .discover-grid {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }

    }


    @media (min-width: 768px) {

      .explore-heading h1 {
        font-size: 36px;
      }

      .explore-search input {
        height: 56px;
      }

    }

  </style>

</head>


<body>

  <div class="app-shell">

    <!-- =================================================
         TOP BAR
         ================================================= -->

    <header class="topbar">

      <a
        href="index.html"
        class="brand"
      >

        <span class="brand-mark">
          B
        </span>

        <span class="brand-text">

          <strong>
            Brocode
          </strong>

          <small>
            Community
          </small>

        </span>

      </a>


      <div class="top-actions">

        <a
          href="notifications.html"
          class="icon-btn notification-btn"
          aria-label="Notifications"
        >
          <span>♢</span>
          <i></i>
        </a>

      </div>

    </header>


    <!-- =================================================
         MAIN
         ================================================= -->

    <main class="content explore-page">


      <!-- HEADING -->

      <section class="explore-heading">

        <span class="eyebrow">
          DISCOVER BROCODE
        </span>

        <h1>
          Explore
        </h1>

        <p>
          Search people, usernames and discover
          what the community is talking about.
        </p>

      </section>


      <!-- SEARCH -->

      <section class="explore-search">

        <span class="search-icon">
          ⌕
        </span>

        <input
          type="search"
          id="exploreSearch"
          placeholder="Search username, ID or topic..."
          autocomplete="off"
        >

        <button
          type="button"
          id="clearSearch"
          class="clear-search"
          aria-label="Clear search"
        >
          ×
        </button>

      </section>


      <!-- SEARCH RESULTS -->

      <section
        id="searchResults"
        class="search-results"
      >

        <div class="section-head">

          <h2>
            Search Results
          </h2>

          <span id="resultCount">
            0 results
          </span>

        </div>

        <div
          id="searchResultList"
          class="search-result-list"
        ></div>

      </section>


      <!-- DEFAULT DISCOVER CONTENT -->

      <div id="discoverContent">


        <!-- TRENDING -->

        <section class="explore-section">

          <div class="section-head">

            <h2>
              Trending Now
            </h2>

            <span>
              Popular today
            </span>

          </div>


          <div
            id="trendingList"
            class="trending-list"
          ></div>

        </section>


        <!-- CATEGORIES -->

        <section class="explore-section">

          <div class="section-head">

            <h2>
              Explore Categories
            </h2>

            <span>
              Find your vibe
            </span>

          </div>


          <div
            id="discoverGrid"
            class="discover-grid"
          ></div>

        </section>

      </div>


    </main>


    <!-- =================================================
         BOTTOM NAV
         ================================================= -->

    <nav
      class="bottom-nav"
      aria-label="Main navigation"
    >

      <a href="index.html">

        <span class="nav-icon">
          ⌂
        </span>

        <span>
          Home
        </span>

      </a>


      <a
        href="explore.html"
        class="active"
      >

        <span class="nav-icon">
          ⌕
        </span>

        <span>
          Explore
        </span>

      </a>


      <a href="support.html">

        <span class="nav-icon">
          ◌
        </span>

        <span>
          Chat
        </span>

      </a>


      <a href="profile.html">

        <span class="nav-icon">
          ◯
        </span>

        <span>
          Profile
        </span>

      </a>

    </nav>

  </div>


  <!-- TOAST -->

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>


  <script src="js/app.js"></script>
  <script src="js/explore.js"></script>

</body>

</html>
