<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Notifications · Brocode</title>

  <meta
    name="description"
    content="Your Brocode notifications."
  />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <style>
    /* =========================================
       BROCODE NOTIFICATIONS
    ========================================= */

    .notifications-page {
      min-height: 100vh;
      padding-bottom: 105px;
    }

    .notifications-container {
      width: min(100%, 820px);
      margin: 0 auto;
      padding: 20px 18px 40px;
    }

    /* Header */

    .notifications-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 24px;
    }

    .notifications-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .notifications-back {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(255,255,255,.035);
      color: var(--text);
      cursor: pointer;
      transition: .2s ease;
    }

    .notifications-back:hover {
      background: rgba(255,255,255,.07);
      transform: translateX(-2px);
    }

    .notifications-back svg {
      width: 19px;
      height: 19px;
    }

    .notifications-title {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -.45px;
    }

    .notifications-subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .mark-all-btn {
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255,255,255,.03);
      color: var(--muted);
      font: inherit;
      font-size: 10px;
      font-weight: 750;
      cursor: pointer;
      transition: .2s ease;
    }

    .mark-all-btn:hover {
      color: var(--text);
      background: rgba(255,255,255,.06);
      border-color: rgba(139,92,246,.25);
    }

    /* Filter */

    .notification-filter {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 15px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .notification-filter::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      flex: 0 0 auto;
      min-height: 33px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,.025);
      color: var(--muted);
      font: inherit;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
    }

    .filter-btn.active {
      color: #ddd6fe;
      border-color: rgba(139,92,246,.35);
      background: rgba(139,92,246,.12);
    }

    /* Notification List */

    .notification-list {
      display: grid;
      gap: 9px;
    }

    .notification-item {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 13px;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: rgba(17,21,31,.76);
      cursor: pointer;
      transition: .2s ease;
    }

    .notification-item:hover {
      background: rgba(255,255,255,.035);
      border-color: rgba(139,92,246,.22);
    }

    .notification-item.unread {
      border-color: rgba(139,92,246,.18);
      background:
        linear-gradient(
          90deg,
          rgba(139,92,246,.07),
          rgba(17,21,31,.78)
        );
    }

    .notification-item.unread::before {
      content: "";
      position: absolute;
      left: 0;
      top: 15px;
      bottom: 15px;
      width: 2px;
      border-radius: 0 4px 4px 0;
      background: #8b5cf6;
    }

    /* Icon */

    .notification-icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      border: 1px solid rgba(139,92,246,.17);
      background: rgba(139,92,246,.08);
      color: #a78bfa;
    }

    .notification-icon svg {
      width: 18px;
      height: 18px;
    }

    .notification-icon.like {
      color: #f472b6;
      background: rgba(244,114,182,.08);
      border-color: rgba(244,114,182,.15);
    }

    .notification-icon.comment {
      color: #60a5fa;
      background: rgba(96,165,250,.08);
      border-color: rgba(96,165,250,.15);
    }

    .notification-icon.support {
      color: #34d399;
      background: rgba(52,211,153,.08);
      border-color: rgba(52,211,153,.15);
    }

    .notification-icon.system {
      color: #fbbf24;
      background: rgba(251,191,36,.08);
      border-color: rgba(251,191,36,.15);
    }

    /* Content */

    .notification-content {
      flex: 1;
      min-width: 0;
    }

    .notification-text {
      margin: 0;
      color: var(--text);
      font-size: 12px;
      line-height: 1.55;
    }

    .notification-text strong {
      font-weight: 800;
    }

    .notification-time {
      margin-top: 5px;
      color: var(--muted);
      font-size: 9px;
    }

    .notification-unread-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      margin-top: 7px;
      border-radius: 50%;
      background: #8b5cf6;
      box-shadow: 0 0 0 4px rgba(139,92,246,.08);
    }

    /* Empty */

    .notifications-empty {
      min-height: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 21px;
      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(139,92,246,.08),
          transparent 38%
        ),
        rgba(17,21,31,.72);
    }

    .notifications-empty-icon {
      width: 70px;
      height: 70px;
      display: grid;
      place-items: center;
      margin-bottom: 18px;
      border-radius: 21px;
      border: 1px solid rgba(139,92,246,.18);
      background: rgba(139,92,246,.08);
      color: #a78bfa;
    }

    .notifications-empty-icon svg {
      width: 29px;
      height: 29px;
    }

    .notifications-empty h2 {
      margin: 0 0 7px;
      font-size: 19px;
      font-weight: 800;
    }

    .notifications-empty p {
      max-width: 390px;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
    }

    @media (max-width: 600px) {

      .notifications-container {
        padding: 16px 13px 30px;
      }

      .notifications-title {
        font-size: 21px;
      }

      .notifications-back {
        width: 39px;
        height: 39px;
      }

      .mark-all-btn {
        padding: 0 9px;
        font-size: 9px;
      }

      .notification-item {
        padding: 13px;
        gap: 11px;
        border-radius: 15px;
      }

      .notification-icon {
        width: 38px;
        height: 38px;
        flex-basis: 38px;
        border-radius: 11px;
      }

      .notification-text {
        font-size: 11.5px;
      }
    }
  </style>
</head>

<body>

  <div class="notifications-page">

    <main class="notifications-container">

      <!-- Header -->
      <header class="notifications-header">

        <div class="notifications-header-left">

          <button
            class="notifications-back"
            type="button"
            onclick="history.back()"
            aria-label="Go back"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M19 12H5"/>
              <path d="M12 19l-7-7 7-7"/>
            </svg>
          </button>

          <div>
            <h1 class="notifications-title">
              Notifications
            </h1>

            <p class="notifications-subtitle">
              Stay updated with your activity
            </p>
          </div>

        </div>

        <button
          class="mark-all-btn"
          id="markAllBtn"
          type="button"
        >
          Mark all read
        </button>

      </header>


      <!-- Filters -->
      <div class="notification-filter">

        <button
          class="filter-btn active"
          data-filter="all"
          type="button"
        >
          All
        </button>

        <button
          class="filter-btn"
          data-filter="likes"
          type="button"
        >
          Likes
        </button>

        <button
          class="filter-btn"
          data-filter="comments"
          type="button"
        >
          Comments
        </button>

        <button
          class="filter-btn"
          data-filter="support"
          type="button"
        >
          Support
        </button>

        <button
          class="filter-btn"
          data-filter="system"
          type="button"
        >
          System
        </button>

      </div>


      <!-- Notifications -->
      <section
        class="notification-list"
        id="notificationList"
      ></section>


      <!-- Empty State -->
      <section
        class="notifications-empty"
        id="notificationsEmpty"
        hidden
      >

        <div class="notifications-empty-icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
            <path d="M10 21h4"/>
          </svg>

        </div>

        <h2>
          You're all caught up
        </h2>

        <p>
          New likes, comments, support replies and important updates
          will appear here.
        </p>

      </section>

    </main>


    <!-- Bottom Navigation -->
    <nav class="bottom-nav" aria-label="Main navigation">

      <a
        href="index.html"
        class="bottom-nav-item"
      >
        <span class="bottom-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3 10.5 12 3l9 7.5"/>
            <path d="M5.5 9.5V21h13V9.5"/>
            <path d="M9.5 21v-6h5v6"/>
          </svg>
        </span>
        <span>Home</span>
      </a>

      <a
        href="explore.html"
        class="bottom-nav-item"
      >
        <span class="bottom-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="11" cy="11" r="6.5"/>
            <path d="m16 16 5 5"/>
          </svg>
        </span>
        <span>Explore</span>
      </a>

      <a
        href="support.html"
        class="bottom-nav-item"
      >
        <span class="bottom-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H8l-4 2v-5.5A7.5 7.5 0 1 1 20 11.5Z"/>
            <path d="M8 11h.01"/>
            <path d="M12 11h.01"/>
            <path d="M16 11h.01"/>
          </svg>
        </span>
        <span>Chat</span>
      </a>

      <a
        href="profile.html"
        class="bottom-nav-item active"
      >
        <span class="bottom-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="8" r="3.5"/>
            <path d="M5 21a7 7 0 0 1 14 0"/>
          </svg>
        </span>
        <span>Profile</span>
      </a>

    </nav>

  </div>


  <div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
  ></div>


  <script src="js/app.js"></script>

  <script>
    /* =========================================
       BROCODE NOTIFICATIONS
       Demo/localStorage version
    ========================================= */

    const NOTIFICATION_KEY =
      "brocode_notifications";

    const listEl =
      document.getElementById("notificationList");

    const emptyEl =
      document.getElementById("notificationsEmpty");

    const markAllBtn =
      document.getElementById("markAllBtn");

    let activeFilter = "all";


    const demoNotifications = [
      {
        id: "n001",
        type: "likes",
        icon: "like",
        unread: true,
        text: "<strong>Someone liked your profile</strong>",
        time: "Just now"
      },
      {
        id: "n002",
        type: "comments",
        icon: "comment",
        unread: true,
        text: "<strong>Someone commented</strong> on your post",
        time: "12 min ago"
      },
      {
        id: "n003",
        type: "support",
        icon: "support",
        unread: true,
        text: "<strong>Brocode Support</strong> replied to your conversation",
        time: "1h ago"
      },
      {
        id: "n004",
        type: "system",
        icon: "system",
        unread: false,
        text: "<strong>Welcome to Brocode!</strong> Your community profile is ready.",
        time: "Yesterday"
      }
    ];


    function getNotifications() {

      try {

        const saved =
          JSON.parse(
            localStorage.getItem(
              NOTIFICATION_KEY
            ) || "null"
          );

        if (
          Array.isArray(saved) &&
          saved.length
        ) {
          return saved;
        }

      } catch {
        // Ignore invalid data.
      }

      localStorage.setItem(
        NOTIFICATION_KEY,
        JSON.stringify(demoNotifications)
      );

      return demoNotifications;
    }


    function saveNotifications(notifications) {

      localStorage.setItem(
        NOTIFICATION_KEY,
        JSON.stringify(notifications)
      );

    }


    function iconMarkup(type) {

      if (type === "like") {
        return `
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M20.8 8.6c0 5.1-8.8 10.1-8.8 10.1S3.2 13.7 3.2 8.6A4.6 4.6 0 0 1 12 6.4a4.6 4.6 0 0 1 8.8 2.2Z"/>
          </svg>
        `;
      }


      if (type === "comment") {
        return `
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H8l-4 2v-5.5A7.5 7.5 0 1 1 20 11.5Z"/>
            <path d="M8 11h.01"/>
            <path d="M12 11h.01"/>
            <path d="M16 11h.01"/>
          </svg>
        `;
      }


      if (type === "support") {
        return `
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M4 13a8 8 0 0 1 16 0"/>
            <path d="M4 13v4a2 2 0 0 0 2 2h1v-6H6a2 2 0 0 0-2 2Z"/>
            <path d="M20 13v4a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 2Z"/>
            <path d="M12 19v2"/>
          </svg>
        `;
      }


      return `
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 10v6"/>
          <path d="M12 7h.01"/>
        </svg>
      `;
    }


    function renderNotifications() {

      const notifications =
        getNotifications();

      const filtered =
        activeFilter === "all"
          ? notifications
          : notifications.filter(
              notification =>
                notification.type === activeFilter
            );


      if (!filtered.length) {

        listEl.innerHTML = "";

        listEl.hidden = true;

        emptyEl.hidden = false;

        return;

      }


      listEl.hidden = false;

      emptyEl.hidden = true;


      listEl.innerHTML =
        filtered.map(notification => {

          const unreadClass =
            notification.unread
              ? "unread"
              : "";

          return `
            <article
              class="notification-item ${unreadClass}"
              data-notification-id="${notification.id}"
            >

              <div
                class="notification-icon ${notification.icon}"
              >
                ${iconMarkup(notification.icon)}
              </div>

              <div class="notification-content">

                <p class="notification-text">
                  ${notification.text}
                </p>

                <div class="notification-time">
                  ${notification.time}
                </div>

              </div>

              ${
                notification.unread
                  ? `
                    <span
                      class="notification-unread-dot"
                    ></span>
                  `
                  : ""
              }

            </article>
          `;

        }).join("");

    }


    /* Mark individual notification as read */

    listEl.addEventListener(
      "click",
      event => {

        const item =
          event.target.closest(
            "[data-notification-id]"
          );

        if (!item) return;

        const id =
          item.dataset.notificationId;

        const notifications =
          getNotifications();

        const notification =
          notifications.find(
            item => item.id === id
          );

        if (!notification) return;

        notification.unread = false;

        saveNotifications(
          notifications
        );

        renderNotifications();

      }
    );


    /* Mark everything as read */

    markAllBtn.addEventListener(
      "click",
      () => {

        const notifications =
          getNotifications();

        notifications.forEach(
          notification => {
            notification.unread = false;
          }
        );

        saveNotifications(
          notifications
        );

        renderNotifications();

        showToast(
          "All notifications marked as read"
        );

      }
    );


    /* Filters */

    document
      .querySelectorAll(".filter-btn")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(
                ".filter-btn"
              )
              .forEach(btn =>
                btn.classList.remove(
                  "active"
                )
              );

            button.classList.add(
              "active"
            );

            activeFilter =
              button.dataset.filter;

            renderNotifications();

          }
        );

      });


    function showToast(message) {

      if (
        window.BrocodeApp &&
        typeof window.BrocodeApp.showToast ===
          "function"
      ) {
        window.BrocodeApp.showToast(
          message
        );
        return;
      }

      const toast =
        document.getElementById("toast");

      if (!toast) return;

      toast.textContent = message;

      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);

    }


    renderNotifications();
  </script>

</body>
</html>
